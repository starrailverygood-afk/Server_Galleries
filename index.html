<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖庫</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>


<div class="sidebar">
    <div class="sidebar-header">
        <h2><i class="fas fa-filter"></i> 篩選標籤</h2>
        <button class="btn-clear" onclick="clearAllFilters()"><i class="fas fa-times"></i> 清除</button>
    </div>
    <div class="stats" id="sidebarStats">
        <div class="stat-item"><i class="fas fa-folder"></i><span id="totalGalleries">0</span>個圖庫</div>
        <div class="stat-item"><i class="fas fa-image"></i><span id="totalImages">0</span>張圖片</div>
    </div>
    <div class="filter-group">
        <h3><i class="fas fa-user"></i> 角色</h3>
        <div class="tag-list" id="character-tags"></div>
    </div>
    <div class="filter-group">
        <h3><i class="fas fa-tag"></i> 標籤</h3>
        <div class="tag-list" id="custom-tags"></div>
    </div>
</div>

<div class="main-content">
    <div class="header">
        <div class="header-left">
            <div class="main-tabs">
                <button class="main-tab active" data-tab="gallery" onclick="switchMainTab('gallery')">
                    <i class="fas fa-images"></i> 圖庫
                </button>
                <button class="main-tab" data-tab="video" onclick="switchMainTab('video')">
                    <i class="fas fa-film"></i> 影片鏈接
                </button>
            </div>
        </div>
    </div>

    <div id="gallerySection">
        <div class="gallery-view" id="galleryView">
            <div class="loading" id="loading"><i class="fas fa-spinner fa-spin"></i> 載入中...</div>
        </div>
    </div>

    <div id="videoSection" style="display:none;">
        <div class="gallery-view" id="videoView"></div>
    </div>
</div>

<script src="b2-manager.js"></script>
<script src="app.js"></script>
<script src="management.js"></script>
</body>
</html>
